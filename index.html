<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="icon" type="image/x-icon" href="/images/madoudinette logo.png" />
    <title>Acceuil - Madoudinette</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "vert-olive": "#929f09",
              "orange-brul": "#e7820a",
              "jaune-dore": "#fab716",
              "marron-fonce": "#52300f",
              "fond-creme": "#FDF7EDCF",
            },
            fontFamily: {
              // AJOUTEZ CETTE LIGNE POUR VOS TITRES :
              display: ["AC Soft Icecream Display", "cursive"],
              // Conservez Montserrat pour le texte :
              sans: ["Montserrat", "Helvetica", "Arial", "sans-serif"],
            },
          },
        },
      };
    </script>

  <body class="flex flex-col min-h-screen">
    <nav class="flex items-center justify-between bg-fond-creme p-4">
      <div class="flex items-center space-x-5">
        <img
          class="h-14 w-14 rounded-lg"

        <h1 class="font-display text-4xl text-marron-fonce">Madoudinette</h1>
      </div>
      <div>
        <ul class="flex space-x-14 mr-14">
          <li
            class="transition delay-150 duration-300 ease-in-out hover:-translate-y-1 hover:scale-110 text-jaune-dore"
          >
            <a href="./index.html">Acceuil</a>
          </li>
          <li
            class="transition delay-150 duration-300 ease-in-out hover:-translate-y-1 hover:scale-110"
          >
            <a href="./catalogue.html">Catalogue</a>
          </li>
          <li
            class="transition delay-150 duration-300 ease-in-out hover:-translate-y-1 hover:scale-110"

            <a href="./contact.html">Contact</a>
          </li>
        </ul>
      </div>
    </nav>

      <div class="max-w-3xl mx-auto aspect-video">
        <h2 class=" text-marron-fonce text-4xl flex justify-center p-7 font-bold">Présentation</h2>

          title="Vidéo Madoudinette"
          frameborder="0"
          allowfullscreen

    <footer
      class="mt-auto flex items-center justify-center bg-fond-creme p-4 space-y-0"
    >
      <p>&copy; Madoudinette - 2025</p>
